<rect x="381" y="140" width="70" height="16" rx="4" fill="#eef2ff"/><text x="416" y="151" text-anchor="middle" font-size="7" fill="#3730a3">list</text>
<rect x="458" y="140" width="70" height="16" rx="4" fill="#eef2ff"/><text x="493" y="151" text-anchor="middle" font-size="7" fill="#3730a3">gaps</text>
<rect x="150" y="162" width="90" height="16" rx="4" fill="#f0fdf4"/><text x="195" y="173" text-anchor="middle" font-size="7" fill="#166534">create_draft</text>
<rect x="248" y="162" width="95" height="16" rx="4" fill="#f0fdf4"/><text x="295" y="173" text-anchor="middle" font-size="7" fill="#166534">suggest_update</text>
<rect x="351" y="162" width="80" height="16" rx="4" fill="#fef3c7"/><text x="391" y="173" text-anchor="middle" font-size="7" fill="#92400e">publish ⚠️</text>
<rect x="439" y="162" width="80" height="16" rx="4" fill="#f0fdf4"/><text x="479" y="173" text-anchor="middle" font-size="7" fill="#166534">feedback</text>

<line x1="250" y1="190" x2="250" y2="215" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="450" y1="190" x2="450" y2="215" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>

<rect x="100" y="220" width="250" height="75" rx="8" fill="white" stroke="#2563eb" stroke-width="1.5"/>
<rect x="100" y="220" width="250" height="18" rx="8" fill="#2563eb"/><rect x="100" y="228" width="250" height="10" fill="#2563eb"/>
<text x="225" y="233" text-anchor="middle" fill="white" font-size="9" font-weight="bold">TF-IDF Search Engine</text>
<text x="225" y="252" text-anchor="middle" font-size="8" fill="#374151">+ helpfulness boost</text>
<text x="225" y="265" text-anchor="middle" font-size="8" fill="#374151">+ freshness boost / stale penalty</text>
<text x="225" y="278" text-anchor="middle" font-size="8" fill="#6b7280">+ expired/deprecated penalty</text>
<text x="225" y="291" text-anchor="middle" font-size="7" fill="#6b7280">Pluggable → adk-rag (semantic)</text>

<rect x="380" y="220" width="220" height="75" rx="8" fill="white" stroke="#dc2626" stroke-width="1.5"/>
<rect x="380" y="220" width="220" height="18" rx="8" fill="#dc2626"/><rect x="380" y="228" width="220" height="10" fill="#dc2626"/>
<text x="490" y="233" text-anchor="middle" fill="white" font-size="9" font-weight="bold">Governance</text>
<text x="490" y="252" text-anchor="middle" font-size="8" fill="#374151">Publish requires reviewer</text>
<text x="490" y="265" text-anchor="middle" font-size="8" fill="#374151">Updates create drafts (immutable)</text>
<text x="490" y="278" text-anchor="middle" font-size="8" fill="#6b7280">Audience + actor context</text>
<text x="490" y="291" text-anchor="middle" font-size="7" fill="#6b7280">Feedback → ticket traceability</text>

<rect x="150" y="310" width="400" height="55" rx="8" fill="#f1f5f9" stroke="#64748b"/>
<text x="350" y="332" text-anchor="middle" font-size="10" font-weight="bold" fill="#334155">Feedback Loop</text>
<text x="350" y="350" text-anchor="middle" font-size="8" fill="#64748b">helpful → boosts ranking | not helpful → penalizes | no results → gap tracked</text>

<rect x="220" y="378" width="260" height="18" rx="9" fill="#4f46e5"/>
<text x="350" y="391" text-anchor="middle" fill="white" font-size="8" font-weight="bold">9 Tools · Governed · TF-IDF · Feedback Loop · ADK-Rust Enterprise</text>
<defs><marker id="a" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto"><polygon points="0 0,7 2.5,0 5" fill="#64748b"/></marker></defs>
</svg>
