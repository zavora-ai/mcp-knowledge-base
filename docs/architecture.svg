<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" font-family="system-ui, -apple-system, sans-serif">
<defs><linearGradient id="hg" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" style="stop-color:#7c3aed"/><stop offset="100%" style="stop-color:#4f46e5"/></linearGradient></defs>
<rect width="700" height="400" fill="#f8fafc" rx="12"/>
<rect x="200" y="10" width="300" height="28" rx="8" fill="url(#hg)"/>
<text x="350" y="29" text-anchor="middle" fill="white" font-size="12" font-weight="bold">mcp-knowledge-base — Architecture</text>
<rect x="250" y="48" width="200" height="34" rx="8" fill="#059669"/>
<text x="350" y="70" text-anchor="middle" fill="white" font-size="11" font-weight="bold">MCP Client / Agent</text>
<line x1="350" y1="82" x2="350" y2="105" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>

<rect x="100" y="110" width="500" height="80" rx="10" fill="white" stroke="#7c3aed" stroke-width="2"/>
<rect x="100" y="110" width="500" height="22" rx="10" fill="url(#hg)"/><rect x="100" y="120" width="500" height="12" fill="url(#hg)"/>
<text x="350" y="126" text-anchor="middle" fill="white" font-size="10" font-weight="bold">mcp-knowledge-base (9 tools)</text>
<rect x="115" y="140" width="90" height="16" rx="4" fill="#eef2ff"/><text x="160" y="151" text-anchor="middle" font-size="7" fill="#3730a3">search</text>
<rect x="212" y="140" width="75" height="16" rx="4" fill="#eef2ff"/><text x="249" y="151" text-anchor="middle" font-size="7" fill="#3730a3">get_article</text>
