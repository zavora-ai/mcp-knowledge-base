[package]
name = "mcp-knowledge-base"
version = "1.2.0"
edition = "2024"
authors = ["James Karanja <james.karanja@zavora.ai>"]
description = "Knowledge Base MCP Server — articles, policies, known issues, TF-IDF search, feedback loops, gap detection, and source-grounded answers"
license = "Apache-2.0"
repository = "https://github.com/zavora-ai/mcp-knowledge-base"
homepage = "https://enterprise.adk-rust.com"
keywords = ["mcp", "knowledge-base", "articles", "search", "enterprise"]
categories = ["development-tools"]
readme = "README.md"

[dependencies]
adk-mcp-sdk = "0.1"
rmcp = { version = "3.1.2", features = ["server", "transport-io", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait = "0.1"
